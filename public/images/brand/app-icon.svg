  <!--
    The app icon: the hoopoe peeking over the bottom edge of the tile.

    Geometry generated from /lab/hoopoe-marks, the "Peeking" mark, whose
    parts are the mascot's own curves (src/app/lab/hoopoe-marks/_parts.tsx,
    which lifts them out of src/components/mascot/hoopoe.tsx). The lab
    window was viewBox "22 -19 78 78"; it is mapped here into the icon's 512 box.

    This is NOT what a browser tab shows. src/app/icon.svg is still the
    three green hills, on purpose: the tab wants the quiet mark and the
    home screen wants the bird.

    Regenerate rather than hand-editing: the shapes are the character's and
    they should follow it if it ever changes.
  -->
