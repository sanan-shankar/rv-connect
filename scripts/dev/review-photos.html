<!doctype html>
<!-- The page scripts/dev/review-photos.mjs serves. Local only; see that file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review photographs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* The app's dark tokens (src/app/globals.css .dark): a photograph is judged
     against a dark surround, which is why Photos and Lightroom use one. */
  :root {
    --bg: #1C2420; --card: #262E29; --raised: #2F3933; --fg: #E8EDE6; --muted: #9AA69E;
    --border: #3E4B44; --canopy: #235C49; --primary: #1F8A4C; --ring: #3FD16A;
    --drop: #E03A33; --star: #E0B34A;
    --serif: "Libre Baskerville", Georgia, serif; --sans: "Source Sans 3", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .app { display: grid; height: 100vh; grid-template: "head head head" 60px "side stage panel" 1fr / 236px 1fr 360px; }
  header { grid-area: head; display: flex; align-items: center; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--border); }
  header h1 { font: 700 17px var(--serif); margin: 0; letter-spacing: -0.01em; }
  .progress { color: var(--muted); font-size: 14px; }
  .progress b { color: var(--fg); font-weight: 600; }
  .filters { margin-left: auto; display: flex; gap: 6px; }
  .chip { border: 1px solid var(--border); background: transparent; border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer; color: var(--muted); transition: background-color 120ms ease-out, color 120ms ease-out; }
  .chip:hover { color: var(--fg); background: var(--card); }
  .chip:active { transform: scale(0.97); }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  aside { grid-area: side; overflow-y: auto; padding: 14px 10px 24px; border-right: 1px solid var(--border); }
  aside h2 { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 10px 6px; }
  .folder { display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .folder:hover { background: var(--card); }
  .folder:active { transform: scale(0.99); }
  .folder[aria-current="true"] { background: var(--raised); }
  .folder .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
  .folder .n.done { color: var(--ring); }

  .stage { grid-area: stage; display: grid; grid-template-rows: 1fr 96px; min-width: 0; min-height: 0; }
  .photo { position: relative; display: grid; place-items: center; min-height: 0; padding: 18px; }
  .photo img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; opacity: 1; transition: opacity 120ms ease-out; }
  .photo img.loading { opacity: 0.35; }
  .photo .broken { color: #F0857F; text-align: center; max-width: 36ch; }
  .photo .badge { position: absolute; top: 26px; left: 26px; padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; pointer-events: none; }
  .badge.keep { background: var(--primary); }
  .badge.drop { background: var(--drop); }
  .nav { position: absolute; top: 0; bottom: 0; width: 18%; border: 0; background: transparent; cursor: pointer; }
  .nav.prev { left: 0; } .nav.next { right: 0; }
  .empty { color: var(--muted); text-align: center; }

  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px 12px; border-top: 1px solid var(--border); scrollbar-width: thin; }
  .thumb { position: relative; flex: 0 0 96px; height: 72px; border: 0; padding: 0; background: var(--card); border-radius: 4px; cursor: pointer; opacity: 0.72; transition: opacity 120ms ease-out; }
  .thumb:hover { opacity: 1; }
  .thumb:active { transform: scale(0.97); }
  .thumb img { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; display: block; }
  .thumb[aria-current="true"] { opacity: 1; outline: 2px solid var(--fg); outline-offset: 2px; }
  .thumb.drop img { filter: grayscale(1); opacity: 0.45; }
  .thumb .dot { position: absolute; right: 4px; bottom: 4px; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--bg); }
  .dot.keep { background: var(--primary); } .dot.drop { background: var(--drop); }
  .thumb .st { position: absolute; left: 4px; top: 2px; color: var(--star); font-size: 13px; text-shadow: 0 0 3px #000; }

  .panel { grid-area: panel; overflow-y: auto; border-left: 1px solid var(--border); padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 22px; }
  .file { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .file b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--fg); font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .decide { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { border-radius: 999px; padding: 10px 14px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-weight: 600; transition: background-color 120ms ease-out, border-color 120ms ease-out; }
  .btn:hover { background: var(--raised); }
  .btn:active { transform: scale(0.98); }
  .btn kbd { font: 12px var(--sans); color: var(--muted); margin-left: 6px; }
  .btn.keep[aria-pressed="true"] { background: var(--canopy); border-color: var(--canopy); }
  .btn.drop[aria-pressed="true"] { background: var(--drop); border-color: var(--drop); }
  .btn.keep[aria-pressed="true"] kbd, .btn.drop[aria-pressed="true"] kbd { color: var(--fg); }
  .star { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; text-align: left; font-weight: 400; border-radius: 12px; }
  .star .glyph { font-size: 18px; color: var(--muted); }
  .star[aria-pressed="true"] { border-color: var(--star); }
  .star[aria-pressed="true"] .glyph { color: var(--star); }
  .star small { display: block; color: var(--muted); font-size: 12.5px; }

  .field label { display: block; font: 700 14px var(--serif); margin-bottom: 6px; }
  .field .why { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .field .why.ok { color: var(--fg); }
  .field input, .field textarea { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .field textarea { resize: vertical; min-height: 72px; }
  .field input:focus, .field textarea:focus { border-color: var(--muted); outline: none; }
  .field .read { font-size: 13px; margin-top: 6px; color: var(--muted); min-height: 18px; }
  .field .read.bad { color: #F0857F; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .keys { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 14px; display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 10px; align-items: center; }
  .keys kbd { font: 600 12px var(--sans); background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
  .saved { font-size: 12.5px; color: var(--muted); opacity: 0; transition: opacity 200ms ease-out; }
  .saved.on { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Review</h1>
    <div class="progress" id="progress"></div>
    <span class="saved" id="saved">Saved</span>
    <div class="filters" id="filters"></div>
  </header>
  <aside id="folders"></aside>
  <main class="stage">
    <div class="photo" id="photo"></div>
    <div class="strip" id="strip"></div>
  </main>
  <section class="panel" id="panel"></section>
</div>
<script>
const S = { items: [], dec: {}, order: [], folder: null, filter: "all", i: 0, list: [] };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const img = (p, s) => `/img?s=${s}&p=${encodeURIComponent(p)}`;
const dir = (p) => p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "";
const base = (p) => p.slice(p.lastIndexOf("/") + 1);

/* The date a photograph will go up with if he says nothing: the catalogue's,
   but only when it came from the camera or from a label someone wrote. What
   he types is read on the server, with the Collection's own rule. */
const suggested = (it) => (it.cat && it.cat.trust !== "no" && it.cat.suggest) || "";
const whenOf = (it) => S.dec[it.p]?.when ?? suggested(it);

const FILTERS = [
  ["all", "All", () => true],
  ["todo", "To do", (it, d) => !d?.verdict],
  ["keep", "Keeping", (it, d) => d?.verdict === "keep"],
  ["drop", "Dropping", (it, d) => d?.verdict === "drop"],
  ["star", "Important", (it, d) => d?.star],
  ["nodate", "Needs a date", (it, d) => d?.verdict !== "drop" && !whenOf(it)],
];
const count = (key) => { const f = FILTERS.find((x) => x[0] === key)[2]; return S.items.filter((it) => f(it, S.dec[it.p])).length; };
/* The list the strip and the arrows walk. Worked out when the folder, the
   filter or a decision changes, not on every key press. */
function refilter() {
  const f = FILTERS.find((x) => x[0] === S.filter)[2];
  S.list = S.items.filter((it) => (!S.folder || dir(it.p) === S.folder) && f(it, S.dec[it.p]));
  S.i = Math.max(0, Math.min(S.i, S.list.length - 1));
}
const current = () => S.list[S.i];

/* ---- rendering ---- */
function renderTop() {
  $("progress").innerHTML = `<b>${S.items.length - count("todo")}</b> of ${S.items.length} decided &middot; ${count("drop")} dropping &middot; ${count("star")} important`;
  $("filters").innerHTML = FILTERS.map(([k, label]) => `<button class="chip" data-f="${k}" aria-pressed="${S.filter === k}">${label}</button>`).join("");
}
function renderFolders() {
  const groups = new Map();
  for (const it of S.items) {
    const d = dir(it.p), parent = dir(d);
    if (!groups.has(parent)) groups.set(parent, new Map());
    const c = groups.get(parent).get(d) || { n: 0, done: 0 };
    c.n++; if (S.dec[it.p]?.verdict) c.done++;
    groups.get(parent).set(d, c);
  }
  // Groups named after a Collection bucket come in the site's order; anything else after.
  const rank = (g) => { const i = S.order.indexOf(base(g)); return i === -1 ? S.order.length : i; };
  const sorted = [...groups].sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0]));
  let html = `<button class="folder" data-d="" aria-current="${!S.folder}"><span>Everything</span><span class="n">${S.items.length}</span></button>`;
  for (const [parent, g] of sorted) {
    html += `<h2>${esc(base(parent) || "Top")}</h2>`;
    for (const [d, c] of g) html += `<button class="folder" data-d="${esc(d)}" aria-current="${S.folder === d}"><span>${esc(base(d))}</span><span class="n ${c.done === c.n ? "done" : ""}">${c.done}/${c.n}</span></button>`;
  }
  $("folders").innerHTML = html;
}
const thumbHtml = (it, k) => {
  const d = S.dec[it.p] || {};
  return `<button class="thumb ${d.verdict || ""}" data-k="${k}" aria-current="${k === S.i}" aria-label="${esc(base(it.p))}">
    <img loading="lazy" src="${img(it.p, "thumb")}" alt="">${d.verdict ? `<span class="dot ${d.verdict}"></span>` : ""}${d.star ? `<span class="st">★</span>` : ""}</button>`;
};
function renderStrip() { $("strip").innerHTML = S.list.map(thumbHtml).join(""); markCurrent(); }
// Moving along the strip only moves the outline; it does not rebuild 770 buttons.
function markCurrent() {
  for (const b of $("strip").querySelectorAll('[aria-current="true"]')) b.setAttribute("aria-current", "false");
  const b = $("strip").children[S.i];
  if (b) { b.setAttribute("aria-current", "true"); b.scrollIntoView({ block: "nearest", inline: "center" }); }
}
function updateThumb(k) { const b = $("strip").children[k]; if (b && S.list[k]) b.outerHTML = thumbHtml(S.list[k], k); }
function renderPhoto() {
  const it = current();
  if (!it) { $("photo").innerHTML = `<p class="empty">Nothing here with this filter.</p>`; return; }
  const d = S.dec[it.p] || {};
  $("photo").innerHTML = `<img class="loading" alt="${esc(base(it.p))}">
    ${d.verdict ? `<span class="badge ${d.verdict}">${d.verdict === "keep" ? "Keeping" : "Dropping"}</span>` : ""}
    <button class="nav prev" aria-label="Previous"></button><button class="nav next" aria-label="Next"></button>`;
  const el = $("photo").querySelector("img");
  el.onload = () => el.classList.remove("loading");
  el.onerror = () => el.outerHTML = `<p class="broken">This file can't be opened. The upload would refuse it too, so it is one to drop or to find a better copy of.</p>`;
  el.src = img(it.p, "large");
  // the next two, so pressing on is instant
  for (const n of S.list.slice(S.i + 1, S.i + 3)) new Image().src = img(n.p, "large");
}
async function showRead(text) {
  const r = await (await fetch(`/api/when?t=${encodeURIComponent(text)}`)).json();
  const el = $("whenRead"); if (!el) return;
  el.className = "read" + (r.bad ? " bad" : "");
  el.textContent = r.bad || (r.label ? `The site will say ${r.label}` : "Leave it empty if nobody knows.");
}
function renderPanel() {
  const it = current();
  if (!it) { $("panel").innerHTML = ""; return; }
  const d = S.dec[it.p] || {}, c = it.cat || {};
  const was = c.from ? `<br>Was in ${esc(dir(c.from) || "the top of the folder")}${base(c.from) !== base(it.p) ? `, as ${esc(base(c.from))}` : ""}` : "";
  const aka = c.aka?.length ? `<br>Also saved as: ${c.aka.map(esc).join(", ")}` : "";
  $("panel").innerHTML = `
    <div class="file"><b>${esc(base(it.p))}</b>${esc(dir(it.p))}${was}${aka}${c.by ? `<br>Photographer: ${esc(c.by)}` : ""}</div>
    <div class="decide">
      <button class="btn keep" data-v="keep" aria-pressed="${d.verdict === "keep"}">Keep<kbd>K</kbd></button>
      <button class="btn drop" data-v="drop" aria-pressed="${d.verdict === "drop"}">Drop<kbd>X</kbd></button>
      <button class="btn star" id="star" aria-pressed="${!!d.star}"><span class="glyph">★</span><span>Important<small>Keep it whatever the quality. <kbd>S</kbd></small></span></button>
    </div>
    <div class="field">
      <label for="when">When</label>
      <p class="why ${c.trust && c.trust !== "no" ? "ok" : ""}">${esc(c.evidence || "No date information for this one.")}</p>
      <input id="when" value="${esc(whenOf(it))}" placeholder="1976, March 1976, or 1970s" autocomplete="off">
      <div class="read" id="whenRead"></div>
    </div>
    <div class="field">
      <label for="people">Who is in it</label>
      <input id="people" value="${esc(d.people ?? "")}" placeholder="Names, separated by commas" autocomplete="off">
    </div>
    <div class="field">
      <label for="caption">Caption</label>
      ${!d.caption && c.caption ? `<p class="why">From the file name. Edit it, or clear it.</p>` : ""}
      <textarea id="caption" placeholder="What is happening, where">${esc(d.caption ?? c.caption ?? "")}</textarea>
    </div>
    <p class="hint">Nothing is deleted here. Drop only marks a photo; you decide later what happens to the marked ones.</p>
    <div class="keys"><span><kbd>←</kbd> <kbd>→</kbd></span><span>move</span><span><kbd>K</kbd></span><span>keep</span><span><kbd>X</kbd></span><span>drop</span><span><kbd>S</kbd></span><span>important</span><span><kbd>U</kbd></span><span>undecide</span><span><kbd>W</kbd></span><span>when</span><span><kbd>P</kbd></span><span>people</span><span><kbd>C</kbd></span><span>caption</span><span><kbd>Esc</kbd></span><span>leave a box</span></div>`;
  showRead(whenOf(it));
  // Each box saves 400ms after typing stops, and on leaving it if anything changed since.
  for (const key of ["when", "people", "caption"]) {
    const el = $(key);
    let last = el.value, t;
    const flush = () => { clearTimeout(t); if (el.value !== last) { last = el.value; decide({ [key]: el.value }); } };
    el.addEventListener("input", () => { if (key === "when") showRead(el.value); clearTimeout(t); t = setTimeout(flush, 400); });
    el.addEventListener("blur", flush);
  }
}
const renderView = () => { renderStrip(); renderPhoto(); renderPanel(); };
function render() { refilter(); renderTop(); renderFolders(); renderView(); }

/* ---- acting ---- */
let savedTimer;
async function decide(patch, advance = false) {
  const it = current(); if (!it) return;
  const k = S.i;
  S.dec[it.p] = { ...S.dec[it.p], ...patch };
  const r = await fetch("/api/decide", { method: "POST", body: JSON.stringify({ p: it.p, patch }) });
  if (!r.ok) { alert("That did not save: " + (await r.text())); return; }
  S.dec[it.p] = await r.json();
  $("saved").classList.add("on"); clearTimeout(savedTimer); savedTimer = setTimeout(() => $("saved").classList.remove("on"), 900);
  renderTop(); renderFolders();
  if (!("verdict" in patch || "star" in patch)) return;      // a typed box changes nothing else on screen
  const before = S.list.length;
  refilter();
  // In a filter the photo just decided can leave the list; then the next one is already at this index.
  const left = S.list.length < before;
  if (advance && !left) S.i = Math.min(k + 1, S.list.length - 1);
  if (left) renderStrip(); else { updateThumb(k); markCurrent(); }
  renderPhoto(); renderPanel();
}
function go(delta) { if (!S.list.length) return; S.i = Math.max(0, Math.min(S.list.length - 1, S.i + delta)); markCurrent(); renderPhoto(); renderPanel(); }
const toggleStar = () => current() && decide({ star: !S.dec[current().p]?.star });

document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.f) { S.filter = t.dataset.f; S.i = 0; render(); }
  else if (t.dataset.d !== undefined) { S.folder = t.dataset.d || null; S.i = 0; render(); }
  else if (t.dataset.k !== undefined) go(+t.dataset.k - S.i);
  else if (t.dataset.v) { const v = S.dec[current()?.p]?.verdict === t.dataset.v ? null : t.dataset.v; decide({ verdict: v }, !!v); }
  else if (t.id === "star") toggleStar();
  else if (t.classList.contains("prev")) go(-1);
  else if (t.classList.contains("next")) go(1);
});
const FOCUS = { w: "when", p: "people", c: "caption" };
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.key === "Escape") { document.activeElement?.blur(); return; }
  if (typing) { if (e.key === "Enter" && document.activeElement.tagName === "INPUT") document.activeElement.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "arrowright") go(1);
  else if (k === "arrowleft") go(-1);
  else if (k === "k") decide({ verdict: "keep" }, true);
  else if (k === "x") decide({ verdict: "drop" }, true);
  else if (k === "s") toggleStar();
  else if (k === "u") decide({ verdict: null });
  else if (FOCUS[k]) $(FOCUS[k])?.focus();
  else return;
  e.preventDefault();
});

fetch("/api/state").then((r) => r.json()).then((s) => {
  S.items = s.items; S.dec = s.decisions || {}; S.order = s.order || [];
  $("title").textContent = s.album; document.title = `Review · ${s.album}`;
  render();
});
</script>
</body>
</html>
