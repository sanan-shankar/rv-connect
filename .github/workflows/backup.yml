name: backup

# Nightly pg_dump of the Supabase database to a PRIVATE R2 bucket, plus a
# nightly copy of the media bucket into that same private bucket.
#
# WHY (database): Supabase's free plan has no automatic backups and no
# point-in-time recovery -- their own docs tell free-tier projects to dump it
# themselves. One database serves both production and local dev (AGENTS.md),
# and CLAUDE.md documents that `prisma db push` will try to DROP tables it
# thinks are orphaned. Until this job existed, a single bad command destroyed
# every member's profile, letters, photos and contribution records with no
# way back.
#
# WHY (media): Cloudflare R2 has no object versioning -- the feature simply
# does not exist, so the security audit's "enable versioning" remediation
# (C2/C4) is impossible as written. This is its fallback, the one the audit
# doc itself names: a scheduled copy to a second bucket. The sync deliberately
# never passes --delete, so a photo deleted from rv-alumni-media -- including
# by the C2 arbitrary-delete bug -- survives here until someone consciously
# removes it from the backup too.
#
# Restore, when you need it. Every night the "Rehearse the restore" step runs
# exactly this against a scratch database, so it is known to work:
#   1. Find the place list that goes with the dump (it is kept apart, below):
#        aws s3api head-object --bucket "$BUCKET" --endpoint-url "$ENDPOINT" \
#          --key postgres/rv-connect-YYYY-MM-DD.dump --query Metadata.place
#   2. Restore in this order, into a FRESH project, never over production:
#        R="pg_restore --no-owner --no-acl --exit-on-error --dbname $TARGET"
#        $R --schema=public --section=pre-data  rv-connect-YYYY-MM-DD.dump
#        $R --data-only                         place-<that id>.dump
#        $R --schema=public --section=data      rv-connect-YYYY-MM-DD.dump
#        $R --schema=public --section=post-data rv-connect-YYYY-MM-DD.dump
#   The place list goes in second because UserPlace points at it and
#   post-data adds that foreign key. Everything of ours is in `public`;
#   Supabase's own schemas already exist in a fresh project. Dumps from
#   before 2026-09-30 still hold the place list and restore in one go.
# A lost photo comes back with:
#   aws s3 cp "s3://$BACKUP_BUCKET/media/<key>" "s3://rv-alumni-media/<key>" \
#     --endpoint-url "https://<account-id>.r2.cloudflarestorage.com"

on:
  schedule:
    # 20:30 UTC == 02:00 IST: the middle of the valley's night, which is when
    # a backup should read a database.
    #
    # This used to claim it MATCHED the catchups cron in vercel.json "so all
    # the quiet-hours work happens in one window". It does not, and the claim
    # encoded a wrong belief worth naming: VERCEL CRONS RUN IN UTC. That cron
    # is '0 2 * * *', which is 02:00 UTC = 07:30 IST -- five and a half hours
    # after this one, in the valley's morning. Nothing is broken by that (a
    # 07:30 IST Round transition is fine), but the next person changing either
    # schedule should not start from a false premise (audit C-147).
    - cron: '30 20 * * *'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway Postgres 17 for the nightly restore rehearsal. Nothing in
    # it outlives the job.
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - name: Refuse to write backups into a public bucket
        env:
          BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          # rv-alumni-media is served publicly from a pub-*.r2.dev URL. A
          # database dump landing there would publish every member's personal
          # data to the open internet. This is the one mistake that must be
          # impossible, so it is checked before anything is produced.
          if [ -z "$BACKUP_BUCKET" ]; then
            echo "::error::R2_BACKUP_BUCKET is not set."
            exit 1
          fi
          case "$BACKUP_BUCKET" in
            rv-alumni-media|*media*|*public*)
              echo "::error::R2_BACKUP_BUCKET is '$BACKUP_BUCKET', which looks like the PUBLIC media bucket."
              echo "::error::Backups must go to a separate PRIVATE bucket. Refusing to run."
              exit 1
              ;;
          esac
          echo "Backup target: $BACKUP_BUCKET (private)"

      - name: Install PostgreSQL 17 client
        run: |
          # The database is PostgreSQL 17.6. pg_dump refuses to dump a server
          # newer than itself, and ubuntu-latest ships an older client, so the
          # matching major version is installed from the official PGDG repo.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # Installing the package is NOT enough. ubuntu-latest ships
          # postgresql-client-common, whose pg_wrapper owns /usr/bin/pg_dump and
          # dispatches to the DEFAULT cluster version -- which stays 16 even
          # after 17 is installed alongside it. The first real run of this job
          # failed exactly here: "server version: 17.6; pg_dump version: 16.15".
          # Addressing the versioned binary directly is the only reliable fix.
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

          # Fail now, loudly, rather than producing a dump against the wrong
          # client and discovering it during a restore.
          "/usr/lib/postgresql/17/bin/pg_dump" --version
          "/usr/lib/postgresql/17/bin/pg_dump" --version | grep -q " 17\." \
            || { echo "::error::pg_dump is not version 17."; exit 1; }

          # Supabase's root certificate, so pg_dump and psql can VERIFY the
          # database (PGSSLMODE=verify-full on the steps that reach it). libpq's
          # default is "prefer": encrypted when offered, but it would fall back
          # to plaintext and never checks who answered (bug audit 3, O-07).
          # The same pinned copy as src/lib/db-tls.ts, where its provenance is
          # written down; db-tls-rule.test.mjs keeps the two identical.
          cat > "$RUNNER_TEMP/supabase-root-2021.crt" <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIDxDCCAqygAwIBAgIUbLxMod62P2ktCiAkxnKJwtE9VPYwDQYJKoZIhvcNAQEL
          BQAwazELMAkGA1UEBhMCVVMxEDAOBgNVBAgMB0RlbHdhcmUxEzARBgNVBAcMCk5l
          dyBDYXN0bGUxFTATBgNVBAoMDFN1cGFiYXNlIEluYzEeMBwGA1UEAwwVU3VwYWJh
          c2UgUm9vdCAyMDIxIENBMB4XDTIxMDQyODEwNTY1M1oXDTMxMDQyNjEwNTY1M1ow
          azELMAkGA1UEBhMCVVMxEDAOBgNVBAgMB0RlbHdhcmUxEzARBgNVBAcMCk5ldyBD
          YXN0bGUxFTATBgNVBAoMDFN1cGFiYXNlIEluYzEeMBwGA1UEAwwVU3VwYWJhc2Ug
          Um9vdCAyMDIxIENBMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqQXW
          QyHOB+qR2GJobCq/CBmQ40G0oDmCC3mzVnn8sv4XNeWtE5XcEL0uVih7Jo4Dkx1Q
          DmGHBH1zDfgs2qXiLb6xpw/CKQPypZW1JssOTMIfQppNQ87K75Ya0p25Y3ePS2t2
          GtvHxNjUV6kjOZjEn2yWEcBdpOVCUYBVFBNMB4YBHkNRDa/+S4uywAoaTWnCJLUi
          cvTlHmMw6xSQQn1UfRQHk50DMCEJ7Cy1RxrZJrkXXRP3LqQL2ijJ6F4yMfh+Gyb4
          O4XajoVj/+R4GwywKYrrS8PrSNtwxr5StlQO8zIQUSMiq26wM8mgELFlS/32Uclt
          NaQ1xBRizkzpZct9DwIDAQABo2AwXjALBgNVHQ8EBAMCAQYwHQYDVR0OBBYEFKjX
          uXY32CztkhImng4yJNUtaUYsMB8GA1UdIwQYMBaAFKjXuXY32CztkhImng4yJNUt
          aUYsMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggEBAB8spzNn+4VU
          tVxbdMaX+39Z50sc7uATmus16jmmHjhIHz+l/9GlJ5KqAMOx26mPZgfzG7oneL2b
          VW+WgYUkTT3XEPFWnTp2RJwQao8/tYPXWEJDc0WVQHrpmnWOFKU/d3MqBgBm5y+6
          jB81TU/RG2rVerPDWP+1MMcNNy0491CTL5XQZ7JfDJJ9CCmXSdtTl4uUQnSuv/Qx
          Cea13BX2ZgJc7Au30vihLhub52De4P/4gonKsNHYdbWjg7OWKwNv/zitGDVDB9Y2
          CMTyZKG3XEu5Ghl1LEnI3QmEKsqaCLv12BnVjbkSeZsMnevJPs1Ye6TjjJwdik5P
          o/bKiIz+Fq8=
          -----END CERTIFICATE-----
          PEM

      - name: Dump the database
        env:
          # The SESSION pooler URL (port 5432, DIRECT_URL), not the transaction
          # pooler: pg_dump needs a real session, and pgbouncer in transaction
          # mode cannot serve one.
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/supabase-root-2021.crt
        run: |
          STAMP="$(date -u +%Y-%m-%d)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # The place list (Place: 235k rows, 36 MB of the 41 MB of table
          # data) is the GeoNames gazetteer behind location search. The app
          # never writes it; only the import scripts in scripts/dev do. Every
          # byte pg_dump reads counts against Supabase's 5 GB-a-month egress,
          # so re-reading it nightly spent about 1 GB a month copying a table
          # that had not changed. It is left out of the nightly dump and kept
          # on its own, re-dumped only when this fingerprint changes (next
          # step). The hash is computed inside Postgres: 32 characters cross
          # the wire, not 36 MB.
          PLACE_FP=$("$PG_BIN/psql" "$DIRECT_URL" -tAc \
            "SELECT md5(string_agg(md5(p::text), '' ORDER BY p.id)) FROM \"Place\" p")
          [ "${#PLACE_FP}" -eq 32 ] \
            || { echo "::error::Could not fingerprint the place list."; exit 1; }
          echo "PLACE_FP=$PLACE_FP" >> "$GITHUB_ENV"
          # Custom format (-Fc): compressed, and pg_restore can pick out a
          # single table from it, which a plain .sql dump cannot do.
          # --no-owner/--no-acl so it restores cleanly into a fresh project
          # whose roles differ from production's.
          "$PG_BIN/pg_dump" "$DIRECT_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --exclude-table-data='public."Place"' \
            --file="rv-connect-$STAMP.dump"
          ls -lh "rv-connect-$STAMP.dump"

      - name: Keep the place list, once per version
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/supabase-root-2021.crt
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          # place-<fingerprint>.dump is never pruned (the prune below only
          # matches rv-connect-*.dump), so every version a nightly dump can
          # point at stays restorable. Fetching the stored copy back for the
          # rehearsal reads from R2, which charges no egress, not Supabase.
          KEY="postgres/place-$PLACE_FP.dump"
          if aws s3api head-object --bucket "$BUCKET" --key "$KEY" \
               --endpoint-url "$ENDPOINT" > /dev/null 2>&1; then
            echo "Place list unchanged ($PLACE_FP)."
            aws s3 cp "s3://$BUCKET/$KEY" "place-$PLACE_FP.dump" \
              --endpoint-url "$ENDPOINT" --no-progress
          else
            echo "Place list is new or changed ($PLACE_FP); dumping it once."
            "$PG_BIN/pg_dump" "$DIRECT_URL" --format=custom --no-owner --no-acl \
              --data-only --table='public."Place"' --file="place-$PLACE_FP.dump"
            aws s3 cp "place-$PLACE_FP.dump" "s3://$BUCKET/$KEY" \
              --endpoint-url "$ENDPOINT"
          fi
          "$PG_BIN/pg_restore" --list "place-$PLACE_FP.dump" \
            | grep -q 'TABLE DATA public Place ' \
            || { echo "::error::The place list dump holds no place data."; exit 1; }

      - name: Verify the dump is readable before trusting it
        run: |
          # A dump that cannot be listed is not a backup, it is a file. This
          # reads the archive's table of contents and fails the job if the
          # dump is truncated or corrupt -- the difference between "we have
          # backups" and "we have backups that work".
          "$PG_BIN/pg_restore" --list "rv-connect-$STAMP.dump" > /tmp/toc.txt
          LINES=$(wc -l < /tmp/toc.txt)
          echo "archive lists $LINES objects"
          if [ "$LINES" -lt 50 ]; then
            echo "::error::Dump lists only $LINES objects. Expected far more. Treating as corrupt."
            exit 1
          fi
          # The tables that would hurt most to lose must actually be present.
          for t in User Post Comment Contribution Photo CatchupEntry; do
            grep -q "TABLE DATA public $t " /tmp/toc.txt \
              || { echo "::error::Table '$t' missing from dump."; exit 1; }
          done
          echo "Dump verified."

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI v2.23+ sends integrity headers that R2 rejects. Without
          # this the upload fails with an opaque 400.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          # The place list's fingerprint rides on the object, so a restore
          # can ask which place-<fingerprint>.dump belongs with this night.
          aws s3 cp "rv-connect-$STAMP.dump" \
            "s3://$BUCKET/postgres/rv-connect-$STAMP.dump" \
            --endpoint-url "$ENDPOINT" --metadata "place=$PLACE_FP"
          echo "Uploaded postgres/rv-connect-$STAMP.dump (place list $PLACE_FP)"

      - name: Rehearse the restore into a scratch database
        env:
          SCRATCH: postgresql://postgres:rehearsal@localhost:5432/postgres
        run: |
          # A backup nobody has restored is a hope. Every night the dump is
          # restored the way the header says a real restore goes, into the
          # throwaway Postgres beside this job, and the job fails if any
          # step errors or the members are not there afterwards. It runs
          # AFTER the upload, so a rehearsal problem never costs a night's
          # backup, and BEFORE the prune, so old backups are only ever
          # removed once a newer one has been proved.
          # The three extensions our indexes and defaults use, in the schema
          # Supabase keeps them in.
          "$PG_BIN/psql" "$SCRATCH" -v ON_ERROR_STOP=1 -q \
            -c 'CREATE SCHEMA IF NOT EXISTS extensions' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm SCHEMA extensions' \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto SCHEMA extensions' \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp" SCHEMA extensions'
          R=("$PG_BIN/pg_restore" --no-owner --no-acl --exit-on-error --dbname "$SCRATCH")
          "${R[@]}" --schema=public --section=pre-data  "rv-connect-$STAMP.dump"
          "${R[@]}" --data-only                         "place-$PLACE_FP.dump"
          "${R[@]}" --schema=public --section=data      "rv-connect-$STAMP.dump"
          "${R[@]}" --schema=public --section=post-data "rv-connect-$STAMP.dump"
          read -r USERS PLACES LINKS <<< "$("$PG_BIN/psql" "$SCRATCH" -tA -F ' ' -c \
            'SELECT (SELECT count(*) FROM "User"), (SELECT count(*) FROM "Place"), (SELECT count(*) FROM "UserPlace")')"
          echo "restored: $USERS members, $PLACES places, $LINKS member places"
          # Floors, not exact counts: ~300 members and 234,935 places on
          # 2026-09-29. Anything under these means rows went missing.
          if [ "$USERS" -lt 100 ] || [ "$PLACES" -lt 200000 ]; then
            echo "::error::Restore rehearsal came back short: $USERS members, $PLACES places."
            exit 1
          fi
          echo "RESTORED=$USERS members, $PLACES places, $LINKS member places" >> "$GITHUB_ENV"

      - name: Prune backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          # ~15MB compressed x 30 days is well under R2's 10GB free storage.
          # The 1st of each month is kept indefinitely, so a corruption that
          # goes unnoticed for six weeks is still recoverable.
          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%d)
          aws s3 ls "s3://$BUCKET/postgres/" --endpoint-url "$ENDPOINT" \
            | awk '{print $4}' | grep -E '^rv-connect-[0-9-]+\.dump$' | while read -r f; do
              D=$(echo "$f" | sed -E 's/rv-connect-([0-9-]+)\.dump/\1/')
              case "$D" in *-01) continue;; esac   # keep monthlies forever
              if [[ "$D" < "$CUTOFF" ]]; then
                aws s3 rm "s3://$BUCKET/postgres/$f" --endpoint-url "$ENDPOINT"
                echo "pruned $f"
              fi
            done

      - name: Report
        run: echo "### Backup $STAMP uploaded and restored in rehearsal ($RESTORED)" >> "$GITHUB_STEP_SUMMARY"

  media:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Refuse to sync into a public bucket
        env:
          BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          # Same guard as the database job: the destination must be the
          # private backup bucket, never anything public-facing.
          if [ -z "$BACKUP_BUCKET" ]; then
            echo "::error::R2_BACKUP_BUCKET is not set."
            exit 1
          fi
          case "$BACKUP_BUCKET" in
            rv-alumni-media|*media*|*public*)
              echo "::error::R2_BACKUP_BUCKET is '$BACKUP_BUCKET', which looks like the PUBLIC media bucket."
              echo "::error::Backups must go to a separate PRIVATE bucket. Refusing to run."
              exit 1
              ;;
          esac
          echo "Sync target: $BACKUP_BUCKET (private)"

      - name: Copy new photos to the private bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          # R2 offers no object versioning, so this copy IS the photo
          # archive's undelete (audit C2/C4). Bucket-to-bucket sync copies
          # server-side inside Cloudflare; nothing streams through the runner.
          #
          # NO --delete, ever: a deletion in the media bucket must never reach
          # the backup. That asymmetry is the entire point of the job. The
          # backup only grows; at WebP sizes that stays far under R2's free
          # tier for years.
          #
          # R2 refuses both ways the CLI has of handling tags on a copy, so
          # every copy here is a plain single CopyObject, which keeps the
          # source's content-type, cache headers and metadata by itself:
          #  - "--copy-props default" asks for the tags with GetObjectTagging
          #    (R2: NotImplemented), but ONLY on multipart copies, i.e. objects
          #    over the 8 MB multipart threshold. The Collection's
          #    full-resolution masters cross it, so from 2026-08-29 every night
          #    failed on those (111 copies a run).
          #  - "--copy-props metadata-directive", the first fix, sends
          #    `x-amz-tagging-directive: REPLACE` on every copy, which R2 also
          #    refuses. It never copied a thing: the nights it passed had
          #    nothing new, and from 2026-10-01, when there was, all of it
          #    failed (57 objects by 10-02).
          # So: "default", with the threshold raised to S3's single-copy
          # ceiling. A photograph is megabytes, so nothing goes multipart,
          # and one that ever did would fail loudly here, not silently.
          aws configure set default.s3.multipart_threshold 5GB
          aws s3 sync "s3://rv-alumni-media" "s3://$BUCKET/media/" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --copy-props default

      - name: Verify the backup holds at least everything live
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          # The backup may hold MORE objects than the live bucket (that means
          # it preserved something that was deleted -- working as intended).
          # It may never hold fewer.
          LIVE=$(aws s3 ls "s3://rv-alumni-media" --recursive --endpoint-url "$ENDPOINT" | wc -l | tr -d ' ')
          SAVED=$(aws s3 ls "s3://$BUCKET/media/" --recursive --endpoint-url "$ENDPOINT" | wc -l | tr -d ' ')
          echo "live: $LIVE objects, backup: $SAVED objects"
          if [ "$SAVED" -lt "$LIVE" ]; then
            echo "::error::Backup holds $SAVED objects but the live bucket holds $LIVE. Sync is incomplete."
            exit 1
          fi
          echo "### Media backup: $SAVED objects (live bucket: $LIVE)" >> "$GITHUB_STEP_SUMMARY"
