name: snapshot

# Nightly metric snapshot into our own database.
#
# WHY: Sentry's free plan drops errors after 30 days, Vercel Analytics keeps 30,
# PostHog keeps a year. None of them will say in 2028 what this site looked like
# in 2026, and none of it is recoverable once dropped. This is the only thing
# that accumulates that history, so a day it does not run is a day permanently
# missing from every chart in /admin/analytics.
#
# Runs at 00:10 UTC (05:40 IST), ten minutes after the UTC day rolls over, and
# records the day that JUST ENDED rather than "today". The old schedule was
# 21:00 UTC -- coincidentally the same minute as retention.yml (audit Low 102)
# -- which also meant PostHog was asked for "today" three hours before the UTC
# day was actually over. That window, 21:00-24:00 UTC == 02:30-05:30 IST, real
# usage for an Indian community, was never counted, for every day, forever
# (audit Lows 51 + 103). Sitting just past midnight instead of just before it
# fixes both: every source is now read at the boundary of the day it gets
# stamped with, and the two nightly jobs no longer land on the same minute.
#
# Still quiet hours: 00:10 UTC is 3h40m after backup.yml (20:30 UTC the
# previous day) and 3h10m after retention.yml (21:00 UTC the previous day),
# and well before the site sees any real morning traffic in IST.

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: >-
          Backfill a specific day (YYYY-MM-DD). Leave blank to record the day
          that just ended. Only PostHog can honestly answer for a day in the
          past -- the database, Sentry and GitHub sources are point-in-time
          counts with no history, so a backfill records PostHog alone and
          leaves the rest absent rather than mislabeling today's counts as
          that day's (audit Low 104).
        required: false

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # The collector needs `pg` and `dotenv` only, but npm ci is what
      # guarantees the lockfile's versions. --ignore-scripts skips the Prisma
      # generate on postinstall, which this script does not use and which would
      # otherwise need a schema-valid datasource for nothing.
      - run: npm ci --ignore-scripts

      - name: Collect
        env:
          # Session pooler, same secret backup.yml uses.
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          # Every one of these is OPTIONAL. The collector skips a source it has
          # no key for and still records everything else -- a vendor being
          # unconfigured, down or rate-limited must never cost us the database
          # numbers, which are the exact ones.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          # Provided automatically by Actions; no secret to create.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${{ inputs.day }}" ]; then
            node scripts/ops/snapshot.mjs --day "${{ inputs.day }}"
          else
            node scripts/ops/snapshot.mjs
          fi

      # Same workflow, because it is the same nightly window and the same
      # connection. Notifications are the one table in this schema that grows
      # without bound -- ~0.8KB each, and 2,000 members at 500 apiece is ~800MB
      # against a 500MB free tier. Everything else is either fixed reference
      # data (Place) or lives in R2.
      # No --days flag ON PURPOSE. It used to say 30 here and 365 in
      # retention.ts, which is the split M55 thought it had fixed; the window
      # lives in KEEP_DAYS.notifications now and this follows it.
      - name: Prune stale notifications
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: node scripts/ops/prune.mjs

      - name: Report
        run: echo "### Snapshot collected and notifications pruned" >> "$GITHUB_STEP_SUMMARY"
