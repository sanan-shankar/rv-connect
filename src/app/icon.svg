<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Rishi Valley">
  <!--
    The browser tab's mark, and the only source favicon.ico is cut from.

    NOT the app icon. public/images/brand/app-icon.svg is the hoopoe, and the
    home screen gets that: a tab is 16px of chrome next to a page title and
    wants the quiet mark, while an icon on a home screen is looked at.

    One cream range on pine. The three planes used to carry three tints, which
    is a tonal separation that survives at 512 and turns to mud by 16. What
    reads at a favicon's size is the outline, and the outline already has all
    three peaks in it. The two inner planes sat entirely inside the silhouette,
    so painting them the same cream would have changed nothing except the file
    size. Hence one path.

    (No double hyphens in here: XML forbids them inside a comment and sharp
    refuses the file outright, which is how the favicon build first broke.)
  -->
  <rect width="512" height="512" rx="96" fill="#173f35" />
  <g transform="translate(85 190) scale(0.38)">
    <path
      d="M-48 390 C-75 390 -98 377 -98 362 C-98 352 -84 348 -70 348 C6 346 82 248 190 198 C284 155 370 179 462 252 C512 199 548 80 622 62 C695 44 683 150 748 158 C786 162 781 107 822 128 C899 168 922 344 980 348 C994 348 1008 352 1008 362 C1008 377 985 390 958 390 Z"
      fill="#eaf1df"
    />
  </g>
</svg>
